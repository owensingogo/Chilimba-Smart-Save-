
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chilimba Smart Save — CEO Setup</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7faf8;
      color: #17231d;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(88%, 390px);
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 24px #123b2a18;
    }
    h2 { color: #123b2a; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccd7d0; }
    button {
      border: 0;
      background: #256b4a;
      color: white;
      font-weight: bold;
    }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h2>CEO Account Setup</h2>
    <p>Chilimba Smart Save</p>

    <form id="setupForm">
      <label for="email">CEO email</label>
      <input id="email" type="email"
        value="owensingogo998@gmail.com" readonly>

      <label for="password">Account password</label>
      <input id="password" type="password"
        autocomplete="current-password"
        required placeholder="Enter your private password">

      <button id="setupButton" type="submit">
        Verify and Set Up CEO
      </button>
    </form>

    <p id="status" role="status"></p>
  </main>

  <script type="module" src="../js/ceo-setup.js"></script>
</body>
</html>
