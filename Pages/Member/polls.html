
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b2a">
<title>Group Polls | Chilimba Smart Save</title>
<link rel="stylesheet" href="../../css/style.css">
<style>
body{font-family:Arial,sans-serif;background:#f7faf8;color:#17231d;margin:0}
main{max-width:760px;margin:25px auto;padding:16px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:18px;box-shadow:0 3px 12px #0000000c}
h1,h2{color:#123b2a}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd7d0;border-radius:7px;font-size:16px}
button{background:#123b2a;color:white;border:0;border-radius:7px;padding:12px;width:100%;margin-top:12px;font-weight:bold}
button:disabled{opacity:.6}
a{color:#123b2a}
.poll{border-top:1px solid #e1e8e3;padding:16px 0;overflow-wrap:anywhere}
.option{display:flex;align-items:center;gap:8px;margin:12px 0;font-weight:normal}
.option input{width:auto}
#message{line-height:1.5}
</style>
</head>
<body>
<main>
<p><a href="dashboard.html">← Back to dashboard</a></p>
<h1>Group Polls & Voting</h1>

<section class="card">
<h2>Create a poll</h2>
<p>Group owners can create polls for members to vote on.</p>
<form id="pollForm">
<label for="group">Select group</label>
<select id="group" required><option value="">Loading groups...</option></select>

<label for="question">Poll question</label>
<input id="question" maxlength="250" required placeholder="What should the group decide?">

<label>Voting options</label>
<input id="option1" maxlength="120" required placeholder="Option 1">
<input id="option2" maxlength="120" required style="margin-top:10px" placeholder="Option 2">
<input id="option3" maxlength="120" style="margin-top:10px" placeholder="Option 3 (optional)">
<input id="option4" maxlength="120" style="margin-top:10px" placeholder="Option 4 (optional)">

<label for="closing">Closing date (optional)</label>
<input id="closing" type="datetime-local">

<button id="createButton" type="submit">Create Poll</button>
<p id="message" role="status"></p>
</form>
</section>

<section class="card">
<h2>Available polls</h2>
<label for="filterGroup">Select group</label>
<select id="filterGroup"><option value="">Select a group</option></select>
<div id="polls">Choose a group to view its polls.</div>
</section>
</main>

<script type="module">
import {auth,db} from "../../js/firebase.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
 collection,query,where,getDocs,doc,getDoc,addDoc,
 setDoc,serverTimestamp,Timestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const form=document.getElementById("pollForm");
const groupInput=document.getElementById("group");
const filterInput=document.getElementById("filterGroup");
const pollsOutput=document.getElementById("polls");
const message=document.getElementById("message");
const createButton=document.getElementById("createButton");

let user=null;
let groups=[];

function say(t){message.textContent=t;}

onAuthStateChanged(auth,async current=>{
 if(!current){location.href="../login.html";return;}
 user=current;

 try{
  const p=await getDoc(doc(db,"users",user.uid));
  if(!p.exists()||p.data().active!==true){
   say("Your account is not active.");
   createButton.disabled=true;
   return;
  }

  const result=await getDocs(query(
   collection(db,"groups"),
   where("memberUids","array-contains",user.uid)
  ));

  groups=result.docs.map(s=>({id:s.id,...s.data()}));
  groupInput.replaceChildren(new Option("Select a group",""));
  filterInput.replaceChildren(new Option("Select a group",""));

  groups.forEach(g=>{
   groupInput.add(new Option(g.name,g.id));
   filterInput.add(new Option(g.name,g.id));
  });

  if(!groups.length){
   say("Join a group first.");
   createButton.disabled=true;
  }
 }catch(e){
  console.error(e);
  say("Could not load groups. Check your connection and Firestore rules.");
 }
});

filterInput.addEventListener("change",loadPolls);

async function loadPolls(){
 const groupId=filterInput.value;
 pollsOutput.replaceChildren();

 if(!groupId){
  pollsOutput.textContent="Choose a group to view its polls.";
  return;
 }

 pollsOutput.textContent="Loading polls...";

 try{
  const result=await getDocs(query(
   collection(db,"polls"),
   where("groupId","==",groupId)
  ));

  pollsOutput.replaceChildren();

  if(result.empty){
   pollsOutput.textContent="No polls have been created for this group.";
   return;
  }

  for(const snap of result.docs){
   const poll=snap.data();
   const pollId=snap.id;
   const item=document.createElement("article");
   item.className="poll";

   const heading=document.createElement("h3");
   heading.textContent=poll.question||"Group poll";
   item.append(heading);

   const status=document.createElement("p");
   status.textContent="Status: "+(poll.status||"unknown");
   item.append(status);

   const voteForm=document.createElement("form");
   const voteOptions=document.createElement("div");

   const voteSnapshot=await getDoc(
    doc(db,"polls",pollId,"votes",user.uid)
   );
   const alreadyVoted=voteSnapshot.exists();

   (poll.options||[]).forEach((option,index)=>{
    const label=document.createElement("label");
    label.className="option";

    const radio=document.createElement("input");
    radio.type="radio";
    radio.name="vote";
    radio.value=option;
    radio.required=true;
    radio.disabled=alreadyVoted||poll.status!=="open";

    label.append(radio,document.createTextNode(option));
    voteOptions.append(label);
   });

   voteForm.append(voteOptions);

   const voteButton=document.createElement("button");
   voteButton.type="submit";
   voteButton.textContent=alreadyVoted?"You have voted":"Submit vote";
   voteButton.disabled=alreadyVoted||poll.status!=="open";
   voteForm.append(voteButton);

   const resultArea=document.createElement("p");
   resultArea.textContent=alreadyVoted
    ?"Your vote has been recorded."
    :"One vote per member is allowed.";

   voteForm.addEventListener("submit",async event=>{
    event.preventDefault();
    const selected=voteForm.querySelector('input[name="vote"]:checked');
    if(!selected)return;

    voteButton.disabled=true;

    try{
     await setDoc(
      doc(db,"polls",pollId,"votes",user.uid),
      {
       uid:user.uid,
       option:selected.value,
       createdAt:serverTimestamp()
      }
     );
     resultArea.textContent="Your vote was recorded.";
     voteButton.textContent="You have voted";
     voteOptions.querySelectorAll("input").forEach(r=>r.disabled=true);
    }catch(e){
     console.error(e);
     resultArea.textContent="Vote failed. Check your Firestore rules.";
     voteButton.disabled=false;
    }
   });

   item.append(voteForm,resultArea);
   pollsOutput.append(item);
  }
 }catch(e){
  console.error(e);
  pollsOutput.textContent="Could not load polls. Check your Firestore rules.";
 }
}

form.addEventListener("submit",async event=>{
 event.preventDefault();

 const group=groups.find(g=>g.id===groupInput.value);
 const question=document.getElementById("question").value.trim();
 const options=[
  document.getElementById("option1").value.trim(),
  document.getElementById("option2").value.trim(),
  document.getElementById("option3").value.trim(),
  document.getElementById("option4").value.trim()
 ].filter(Boolean);

 const closing=document.getElementById("closing").value;

 if(!group||!question||options.length<2){
  say("Select a group, enter a question and provide at least two options.");
  return;
 }

 if(new Set(options).size!==options.length){
  say("Each voting option must be different.");
  return;
 }

 if(group.ownerUid!==user.uid){
  say("Only the group owner can create polls under the current rules.");
  return;
 }

 let closesAt=null;
 if(closing){
  const date=new Date(closing);
  if(Number.isNaN(date.getTime())||date<=new Date()){
   say("The closing date must be in the future.");
   return;
  }
  closesAt=Timestamp.fromDate(date);
 }

 createButton.disabled=true;
 say("Creating poll...");

 try{
  await addDoc(collection(db,"polls"),{
   groupId:group.id,
   question,
   type:"single-choice",
   options,
   createdBy:user.uid,
   status:"open",
   closesAt,
   createdAt:serverTimestamp()
  });

  form.reset();
  say("Poll created successfully.");
  filterInput.value=group.id;
  await loadPolls();
 }catch(e){
  console.error(e);
  say("Could not create poll. Check your Firestore rules.");
 }finally{
  createButton.disabled=false;
 }
});
</script>
</body>
</html>
